; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
; Путь к проектным заголовкам нужен и библиотечным TU: классы пакета temperature
; (TestIRSensor, ChangeIRSensorAddress) наследуют DeviceLogic из include/.
build_flags =
    -I include
; Глубокий поиск зависимостей: пакет temperature ссылается на проектные заголовки
; (device_logic.h -> display.h -> LiquidCrystal_I2C.h, bms_reader.h -> daly-bms-uart.h),
; цепочка должна раскрываться и дальше по заголовкам.
lib_ldf_mode = deep+
lib_deps = 
    https://github.com/johnrickman/LiquidCrystal_I2C.git
    adafruit/Adafruit MLX90614 Library@^2.1.6
    adafruit/Adafruit BusIO@^1.17.4
