; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
; У тулчейна AVR нет стандартной библиотеки C++ (нет даже <type_traits>), поэтому
; TinyFSM переводится в режим TINYFSM_NOSTDLIB: отключаются только compile-time
; проверки static_assert, логика машины не меняется. Для окружения ESP32 этот
; флаг не нужен — там libstdc++ есть целиком.
build_flags =
    -D TINYFSM_NOSTDLIB
; Глубокий поиск зависимостей: сторонние библиотеки (LiquidCrystal, RTClib,
; Adafruit MLX90614, daly-bms-uart) подключаются через проектные заголовки
; (device_logic.h, date_time_module.h и т.д.), цепочка должна раскрываться
; по заголовкам.
lib_ldf_mode = deep+
lib_deps = 
    https://github.com/johnrickman/LiquidCrystal_I2C.git
    adafruit/Adafruit MLX90614 Library@^2.1.6
    adafruit/Adafruit BusIO@^1.17.4
    adafruit/RTClib@^2.1.4
    ; FreeRTOS: задача-планировщик только проставляет флаг периода, вся работа
    ; приложения — в главном цикле (idle-контекст). На ESP32 FreeRTOS встроена.
    https://github.com/feilipu/Arduino_FreeRTOS_Library.git
    ; TinyFSM: стейт-машина на C++11, header-only, без динамической памяти и
    ; RTTI. Состояния и события — классы (SOLID), "platforms": "*" — подходит
    ; и для ATmega328P, и для ESP32.
    https://github.com/digint/tinyfsm.git
