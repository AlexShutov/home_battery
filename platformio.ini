; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; По умолчанию собирается прошивка контроллера; native-окружение —
; только для юнит-тестов (pio test -e native).
default_envs = nanoatmega328

[env:native]
platform = native
test_framework = unity
; Нативные юнит-тесты логики: из src/ в сборку тестов попадают только
; файлы без зависимостей от Arduino (список расширяется по мере появления
; чистой логики).
; Native-окружение: юнит-тесты логики без Arduino-железа.
test_build_src = true
; Диалект C++ задаётся явно: без флага хост-компилятор собирает по старому
; стандарту (без constexpr), общий знаменатель платформ — C++11.
; Путь к lib/daly-bms-uart нужен тестам драйвера БМС: LDF не сканирует
; файлы из test/, библиотека подключается явным путём включения.
build_flags =
    -std=c++11
    -I lib/daly-bms-uart
build_src_filter =
    -<*>
    +<device/battery/charge_percentage_calculator.cpp>
    +<chargecontrol/charge_target_calculator.cpp>

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
; Перед каждой сборкой прошивки прогоняются нативные юнит-тесты
; (pio test -e native); провал любого теста прерывает сборку.
extra_scripts = pre:scripts/run_tests.py
; У тулчейна AVR нет стандартной библиотеки C++ (нет даже <type_traits>), поэтому
; TinyFSM переводится в режим TINYFSM_NOSTDLIB: отключаются только compile-time
; проверки static_assert, логика машины не меняется. Для окружения ESP32 этот
; флаг не нужен — там libstdc++ есть целиком.
build_flags =
    -D TINYFSM_NOSTDLIB
    ; NDEBUG: отключает assert() в mlinterp — строки ассертов не занимают
    ; RAM/flash на AVR, проверка аргументов не нужна во внештатном режиме.
    -D NDEBUG
; Глубокий поиск зависимостей: сторонние библиотеки (LiquidCrystal, RTClib,
; Adafruit MLX90614, daly-bms-uart) подключаются через проектные заголовки
; (device_logic.h, date_time_module.h и т.д.), цепочка должна раскрываться
; по заголовкам.
lib_ldf_mode = deep+
lib_deps = 
    https://github.com/johnrickman/LiquidCrystal_I2C.git
    adafruit/Adafruit MLX90614 Library@^2.1.6
    adafruit/Adafruit BusIO@^1.17.4
    adafruit/RTClib@^2.1.4
    ; FreeRTOS: задача-планировщик только проставляет флаг периода, вся работа
    ; приложения — в главном цикле (idle-контекст). На ESP32 FreeRTOS встроена.
    https://github.com/feilipu/Arduino_FreeRTOS_Library.git
    ; TinyFSM: стейт-машина на C++11, header-only, без динамической памяти и
    ; RTTI. Состояния и события — классы (SOLID), "platforms": "*" — подходит
    ; и для ATmega328P, и для ESP32.
    https://github.com/digint/tinyfsm.git
    ; mlinterp: линейная интерполяция по таблице (MIT, один заголовок,
    ; без кучи и зависимостей) — расчёт процента зарядки по кривой разряда.
    ; Завендорена в lib/mlinterp с портом под AVR: у тулчейна нет стандартной
    ; библиотеки C++ (<cassert>, <limits>), они заменены на C-эквиваленты.
    ; https://github.com/parsiad/mlinterp.git (коммит e3a9a9c)
